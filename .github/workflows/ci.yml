name: CI

on:
  push:
    branches: [master]
  pull_request+:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Types
        run: npm run build

      - name: Test Build
        run: npm run build


      - name: Test Build
        run: npm run lint


      - name: Test Build
        run: npm run test

      - name: Test Build
        run: npm run build

