name: Renovate

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Run Renovate Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Renovate token
        run: |
          if [ -z "${{ secrets.RENOVATE_TOKEN }}" ]; then
            echo "RENOVATE_TOKEN secret is required to let Renovate-created PRs trigger CI workflows."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v44.0.3
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
